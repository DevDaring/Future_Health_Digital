# ---------------------------------------------------------------------------
# Ground-truth behaviour model (hidden from the ML; drives labels and the twin)
#   logit(p_return_no_outreach) = b0 - a1*lang_mismatch - a2*night_or_rotating
#       - a3*distance_km/10 - a4*prior_no_shows - a5*basic + a6*severity_level
#       - a7*low_literacy - a8*no_free_weekdays
# ---------------------------------------------------------------------------
behaviour:
  b0: 2.05
  a1_lang_mismatch: 1.0
  a2_night_or_rotating: 0.85
  a3_distance_per_10km: 0.25
  a4_prior_no_show: 0.35
  a5_basic_insurance: 0.6
  a6_severity_level: 0.45
  a7_low_literacy: 0.55
  a8_no_free_weekdays: 0.45
  days_since_result_decay: 0.01     # logit drop per day the result sits unexplained
  # Treatment effect of an outreach action (logit scale). Heterogeneous by design.
  e_base: 0.15                      # any personal contact
  e_lang_match: 0.85                # language-matched contact fixes a mismatch
  e_shift_slot: 0.75                # evening/Friday slot for night/rotating shifts
  e_friday_no_free_weekdays: 0.75   # Friday slot for people with no free weekdays
  e_near_home: 0.45                 # near-home slot for people > 15 km away
  e_cost_info: 0.55                 # cost information for basic insurance
  e_call_low_literacy: 0.35         # phone/in-person for literacy level 1
  e_channel_other: 0.10
  e_sms: 0.05                       # generic SMS
  unmatched_language_damp: 0.35     # effect kept when the message is in the wrong language
  high_cost_barrier_damp: 0.30      # basic + >30 km + no cost info: outreach barely helps
  chronic_no_show_damp: 0.25        # >=3 prior no-shows: one contact rarely changes behaviour
  chronic_no_show_threshold: 3
  return_time_mean_days: 18         # mean days to attend if the person will return
  contacted_return_time_mean_days: 9
  sla_horizon_days: 60              # "returned" = attended within this window in history

history:
  n_loops: 36000                    # simulated historical abnormal results (for training)
  treat_share: 0.5                  # randomised outreach trial
